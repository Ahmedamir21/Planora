<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Planora — Build, Compare, Share</title>
  <desc id="desc">Planora banner with a premium midnight background, violet-to-blue calendar mark and amber schedule highlight.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D18"/>
      <stop offset=".55" stop-color="#11172A"/>
      <stop offset="1" stop-color="#0B1224"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientTransform="translate(1100 80) rotate(135) scale(520 390)">
      <stop stop-color="#6D5EF6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#6D5EF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientTransform="translate(1220 420) rotate(180) scale(420 300)">
      <stop stop-color="#3B82F6" stop-opacity=".18"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="92" y1="84" x2="355" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset=".5" stop-color="#6D5EF6"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FDBA45"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="520" rx="36" fill="url(#bg)"/>
  <rect width="1400" height="520" rx="36" fill="url(#glow1)"/>
  <rect width="1400" height="520" rx="36" fill="url(#glow2)"/>
  <g transform="translate(80 82)">
    <rect x="0" y="46" width="260" height="244" rx="52" fill="none" stroke="url(#brand)" stroke-width="24"/>
    <path d="M0 111h260" stroke="url(#brand)" stroke-width="24"/>
    <path d="M66 22v54M194 22v54" stroke="url(#brand)" stroke-width="28" stroke-linecap="round"/>
    <rect x="42" y="148" width="48" height="42" rx="10" fill="#7563F4"/>
    <rect x="106" y="148" width="48" height="42" rx="10" fill="#6755E9"/>
    <rect x="170" y="148" width="48" height="42" rx="10" fill="url(#warm)"/>
    <rect x="42" y="206" width="48" height="42" rx="10" fill="#5F55E8"/>
    <rect x="106" y="206" width="48" height="42" rx="10" fill="#8B5CF6"/>
    <rect x="170" y="206" width="48" height="42" rx="10" fill="#3B82F6"/>
  </g>
  <text x="410" y="230" fill="#F8FAFC" font-family="Inter,Segoe UI,sans-serif" font-size="112" font-weight="800" letter-spacing="-4">Planora</text>
  <text x="418" y="292" fill="#A8B0C3" font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="600" letter-spacing="8">BUILD • COMPARE • SHARE</text>
  <rect x="416" y="342" width="184" height="44" rx="22" fill="#171E34" stroke="#2B3558"/>
  <text x="508" y="371" text-anchor="middle" fill="#F59E0B" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700">FALL 2026</text>
  <text x="418" y="430" fill="#77829B" font-family="Inter,Segoe UI,sans-serif" font-size="19" font-weight="500">Student-built. Unofficial. Your schedule, your choices.</text>
</svg>
