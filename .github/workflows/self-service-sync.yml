name: Self-Service Draft Sync

on:
  workflow_dispatch:
    inputs:
      course_codes:
        description: 'Comma-separated course codes for this safe test (example: CSAI 201,MATH 105)'
        required: true
        default: 'CSAI 201'
        type: string

permissions:
  contents: read

jobs:
  fetch-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install scraper dependency
        working-directory: sync
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: sync
        run: npx playwright install --with-deps chromium

      - name: Fetch Self-Service into Planora Draft
        run: node sync/self-service-sync.mjs
        env:
          PLANORA_COURSE_CODES: ${{ inputs.course_codes }}
          SELF_SERVICE_USERNAME: ${{ secrets.SELF_SERVICE_USERNAME }}
          SELF_SERVICE_PASSWORD: ${{ secrets.SELF_SERVICE_PASSWORD }}
          SELF_SERVICE_RESULTS_SELECTOR: ${{ secrets.SELF_SERVICE_RESULTS_SELECTOR }}
          SELF_SERVICE_SEARCH_SELECTOR: ${{ secrets.SELF_SERVICE_SEARCH_SELECTOR }}
          PLANORA_SYNC_INGEST_URL: ${{ secrets.PLANORA_SYNC_INGEST_URL }}
          PLANORA_SYNC_INGEST_SECRET: ${{ secrets.PLANORA_SYNC_INGEST_SECRET }}
